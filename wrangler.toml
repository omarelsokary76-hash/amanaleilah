name = "amanaleilah-api"
main = "worker.js"
compatibility_date = "2024-09-01"

# هيتحدث تلقائيًا بالأمر اللي هنشغله - سيبها زي ما هي
[[d1_databases]]
binding = "DB"
database_name = "amanaleilah-db"
database_id = "d7e94ae3-aa22-4e97-ab25-5f06d824f9b9"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "amanaleilah-media"

# مطلوب لتشفير الموقع الجغرافي الحساس قبل تخزينه (AES-GCM).
# شغّل الأوامر دي مرة واحدة من التيرمينال بعد النشر (لو مش متسجلين قبل كده):
#   openssl rand -base64 32
#   wrangler secret put ENCRYPTION_KEY
# (والمفتاح ده منفصل تمامًا عن ADMIN_KEY اللي بيحمي لوحة التحكم)

# تشغيل تلقائي يومي (الساعة 3 صباحًا بتوقيت UTC) لحذف الأحداث ورسايل الشات
# اللي عدى عليها أكتر من 30 يوم، امتثالًا لسياسة الاحتفاظ بالبيانات.
[triggers]
crons = ["0 3 * * *"]

# حماية من محاولات تخمين كود العائلة / رقم الهاتف على شاشات الدخول والتسجيل وإنشاء العائلة.
# 10 محاولات كحد أقصى لكل IP كل دقيقة (تقدر تغيّر الرقم حسب احتياجك).
[[ratelimits]]
binding = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
