name = "amanaleilah-api"
main = "worker.js"
compatibility_date = "2024-09-01"

# هيتحدث تلقائيًا بالأمر اللي هنشغله - سيبها زي ما هي
[[d1_databases]]
binding = "DB"
database_name = "amanaleilah-db"
database_id = "d7e94ae3-aa22-4e97-ab25-5f06d824f9b9"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "amanaleilah-media"

# تشغيل كل دقيقة: إرسال إشعارات تذكير الأدوية في معادها. وكل ساعة (عند الدقيقة 0): حذف البيانات الأقدم من 30 يوم + تنفيذ طلبات حذف الحساب المؤجلة (24 ساعة)
[triggers]
crons = ["* * * * *"]

# بيانات بتظهر في صفحة سياسة الخصوصية الحية (/privacy-policy) - مش أسرار، عادي تتحط هنا صريحة
[vars]
PRIVACY_CONTACT_EMAIL = "omarelsokary76@gmail.com"
PRIVACY_DEVELOPER_NAME = "فريق أمان العيلة"
PRIVACY_POLICY_DATE = "2026-10-04"

# ===== بيانات التحقق بتاعة تطبيق TWA (Digital Asset Links) =====
# سيبهم فاضيين لحد ما تولّد مفتاح التوقيع من PWABuilder أو Bubblewrap، وهيديك القيمتين دول بالظبط.
# بعد ما تحطهم هنا، انشر تاني (wrangler deploy) و/.well-known/assetlinks.json هيتفعّل تلقائيًا.
TWA_PACKAGE_NAME = ""
TWA_SHA256_FINGERPRINT = ""

# ملحوظة: الحد من محاولات الدخول (Rate Limiting) بقى شغال بالكامل عن طريق جدول D1 عادي
# (rate_limits) بدل Cloudflare Rate Limiting binding - عشان محدش يتعب في مشكلة نشر بسببه تاني.
# شغّل rate_limit_migration.sql عشان يشتغل.

# ==========================================================================
# تكرار إنذار الاستغاثة (Durable Object) - رجعناها معطّلة تاني بناءً على طلب
# صريح (مش محتاجينها، ومحتمل تكون هي سبب مشكلة نشر قبل كده). الكود شغال
# عادي من غيرها (بيبعت إشعار Push واحد بس بدل التكرار).
#
# [[durable_objects.bindings]]
# name = "SOS_ALARM"
# class_name = "SosAlarm"
#
# [[migrations]]
# tag = "v1"
# new_classes = ["SosAlarm"]
# ==========================================================================
